name: Build Orion

on:
  push:
    branches: [ "main", "master" ]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # Permite ejecutar el build manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APKs (Debug y Release)
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APKs como artefactos descargables
        uses: actions/upload-artifact@v4
        with:
          name: Orion-Launcher-APKs
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 14
