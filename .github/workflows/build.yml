name: Build Orion

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1. PRs y Pushes generales (no tags): Valida compilación y linting en Debug
      - name: Build Debug & Run Lint
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew assembleDebug lintRelease --no-daemon

      # 2. Tagged Push (v*): Decodifica el Keystore codificado en Base64 desde los Secrets
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/couchy-release.jks

      # 3. Tagged Push (v*): Compila y firma la APK de Release inyectando variables de entorno
      - name: Build Signed Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE: /tmp/couchy-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 4. Publica el binario final en la sección de Releases de GitHub
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK="Orion-Launcher-${{ github.ref_name }}.apk"
          
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "$RELEASE_APK"
            gh release delete "${{ github.ref_name }}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "${{ github.ref_name }}" \
              "$RELEASE_APK" \
              --title "Orion-Launcher ${{ github.ref_name }}" \
              --generate-notes
          else
            echo "Error: No se encontró el APK en la ruta $APK_PATH"
            exit 1
          fi

      # 5. Limpieza de seguridad: Elimina el Keystore del entorno del runner
      - name: Clean up Keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f /tmp/couchy-release.jks
